[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoprocessor"
version = "0.1.0"
description = "Bibliothèque Python de traitements géospatiaux"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "pyogrio>=0.9,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pytest-cov>=5",
     "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.mypy]
python_version = "3.11"
files = ["src/geoprocessor"]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true